plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

version = '1.0.0'
group = 'com.example.fletcheryaddon'

base {
	archivesName = 'example-fletchery-addon'
}

repositories {
	maven { url = 'https://api.modrinth.com/maven' } // для fletchery_expanded, если публикуется на Modrinth
}

dependencies {
	minecraft "com.mojang:minecraft:1.21.1"
	mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
	modImplementation "net.fabricmc:fabric-loader:0.19.3"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.0+1.21.1"

	// Fletchery Expanded как compile/runtime зависимость
	modImplementation "maven.modrinth:fletchery-expanded:<version>"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}
